name: Temporary Patch 28 Kotlin Fix

on:
  push:
    branches:
      - agent/patch-28-magic-compose-close-and-multiline

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Patch 28 branch
        uses: actions/checkout@v4
        with:
          ref: agent/patch-28-magic-compose-close-and-multiline
          fetch-depth: 0

      - name: Repair malformed Kotlin line split
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/kotlin/com/souadachak/fixarabickeyboard/keyboard/KeyboardImeService.kt')
          text = path.read_text(encoding='utf-8')
          old = ".split('" + "\n" + "')\n            .sumOf"
          new = ".lineSequence()\n            .sumOf"
          if old not in text:
              raise SystemExit('Malformed multiline split expression not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary branch files
        run: |
          rm -f tools/fix_patch28_line_split.py
          rm -f .github/workflows/fix-patch28-line-split.yml

      - name: Commit corrected Patch 28
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Patch 28 multiline height compilation"
          git push
