name: Apply Patch 26

on:
  push:
    branches:
      - agent/patch-26-magic-compose-layer-smart-toolbar
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Patch 26 branch
        uses: actions/checkout@v4
        with:
          ref: agent/patch-26-magic-compose-layer-smart-toolbar
          fetch-depth: 0

      - name: Normalize escaped Kotlin newline in transformation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_patch26.py')
          source = path.read_text(encoding='utf-8')
          needle = 'hint = "اكتب النص هنا فقط…\\nوضع الإصلاح مفعل…"'
          replacement = 'hint = "اكتب النص هنا فقط…\\\\nوضع الإصلاح مفعل…"'
          if needle not in source:
              raise SystemExit('Expected Kotlin hint pattern was not found')
          path.write_text(source.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Apply source transformation
        run: python3 tools/apply_patch26.py

      - name: Remove temporary automation files
        run: |
          rm tools/apply_patch26.py
          rm .github/workflows/apply-patch26.yml

      - name: Commit Patch 26 source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement magic compose layer and smart toolbar states"
          git push origin HEAD:agent/patch-26-magic-compose-layer-smart-toolbar
