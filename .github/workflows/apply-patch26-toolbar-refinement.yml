name: Apply Patch 26 Toolbar Refinement

on:
  push:
    branches:
      - agent/patch-26-magic-compose-layer-smart-toolbar

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Patch 26 branch
        uses: actions/checkout@v4
        with:
          ref: agent/patch-26-magic-compose-layer-smart-toolbar
          fetch-depth: 0

      - name: Apply toolbar refinement
        run: python3 tools/apply_patch26_toolbar_refinement.py

      - name: Remove temporary automation files
        run: |
          rm tools/apply_patch26_toolbar_refinement.py
          rm .github/workflows/apply-patch26-toolbar-refinement.yml

      - name: Commit refined Patch 26
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine magic action and more-tools toolbar"
          git push
