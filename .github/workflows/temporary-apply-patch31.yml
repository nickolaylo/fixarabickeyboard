name: Temporary Apply Patch 31

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/patch-31-performance-emoji-panel-manual-lines'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patch 31 branch
        uses: actions/checkout@v4
        with:
          ref: agent/patch-31-performance-emoji-panel-manual-lines
          fetch-depth: 0

      - name: Apply Patch 31 once
        shell: bash
        run: |
          if [ ! -f tools/apply_patch31.py ]; then
            echo "Patch 31 transformer already consumed."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("tools/apply_patch31.py")
          text = path.read_text(encoding="utf-8")
          pattern = r"def replace_once\(text: str, old: str, new: str, label: str\) -> str:\n.*?\n\n"
          replacement = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if label == "initial key-area content" and count == 2:
                  return text.replace(old, new, 1)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          '''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise RuntimeError("Could not replace Patch 31 helper function")
          path.write_text(text, encoding="utf-8")
          PY

          python tools/apply_patch31.py

          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/kotlin/com/souadachak/fixarabickeyboard/keyboard/KeyboardImeService.kt")
          text = path.read_text(encoding="utf-8")
          old = "emojiRecentRow?.post { row -> renderRecentEmojis(row) }"
          new = "emojiRecentRow?.let { row -> row.post { renderRecentEmojis(row) } }"
          if old not in text:
              raise RuntimeError("Expected recent-emoji refresh expression was not generated")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          rm -f tools/apply_patch31.py
          rm -f tools/patch31-trigger.txt
          rm -f tools/patch31-trigger-2.txt
          rm -f tools/patch31-trigger-3.txt
          rm -f tools/patch31-trigger-4.txt
          rm -f .github/workflows/apply-patch31.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Patch 31: improve typing and add emoji panel"
          git push origin HEAD:agent/patch-31-performance-emoji-panel-manual-lines
