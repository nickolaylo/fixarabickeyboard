name: Sync Patch 28 Journal

on:
  push:
    branches:
      - agent/patch-28-magic-compose-close-and-multiline

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patch-28-magic-compose-close-and-multiline
          fetch-depth: 0
      - run: python3 tools/sync_patch28_journal.py
      - run: |
          rm tools/sync_patch28_journal.py
          rm .github/workflows/sync-patch28-journal.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync Patch 28 project journal"
          git push
