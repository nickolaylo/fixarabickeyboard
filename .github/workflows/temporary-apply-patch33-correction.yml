name: Temporary Apply Patch 33 Correction

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/patch-33-cold-start-dictionary-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patch-33-cold-start-dictionary-quality
          fetch-depth: 0

      - run: |
          python tools/patch33_suggestion_fix.py
          python tools/patch33_dictionary_pool.py
          python tools/patch33_card_direction.py
          python tools/patch33_journal_update.py

      - run: |
          rm -f tools/patch33_suggestion_fix.py
          rm -f tools/patch33_dictionary_pool.py
          rm -f tools/patch33_card_direction.py
          rm -f tools/patch33_journal_update.py
          rm -f tools/patch33-correction-trigger.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Patch 33: complete contextual cold-start suggestions"
          git push origin HEAD:agent/patch-33-cold-start-dictionary-quality
