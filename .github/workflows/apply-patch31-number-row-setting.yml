name: Apply Patch 31 Number Row Setting

on:
  push:
    branches:
      - agent/patch-31-performance-emoji-panel-manual-lines
    paths:
      - tools/apply_patch31_number_row_setting.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patch 31 branch
        uses: actions/checkout@v4
        with:
          ref: agent/patch-31-performance-emoji-panel-manual-lines
          fetch-depth: 0

      - name: Apply number-row setting
        run: python tools/apply_patch31_number_row_setting.py

      - name: Remove temporary applicator
        run: |
          rm tools/apply_patch31_number_row_setting.py
          rm .github/workflows/apply-patch31-number-row-setting.yml

      - name: Commit Patch 31 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Patch 31: add adaptive number row setting"
          git push origin HEAD:agent/patch-31-performance-emoji-panel-manual-lines
