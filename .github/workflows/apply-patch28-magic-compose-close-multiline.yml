name: Apply Patch 28 Magic Compose Close Multiline

on:
  push:
    branches:
      - agent/patch-28-magic-compose-close-and-multiline

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Patch 28 branch
        uses: actions/checkout@v4
        with:
          ref: agent/patch-28-magic-compose-close-and-multiline
          fetch-depth: 0

      - name: Apply Patch 28
        run: python3 tools/apply_patch28_magic_compose_close_multiline.py

      - name: Remove temporary automation files
        run: |
          rm tools/apply_patch28_magic_compose_close_multiline.py
          rm .github/workflows/apply-patch28-magic-compose-close-multiline.yml

      - name: Commit Patch 28
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add close control and multiline magic compose"
          git push
