name: Apply Patch 31

on:
  push:
    branches:
      - agent/patch-31-performance-emoji-panel-manual-lines

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patch-31-performance-emoji-panel-manual-lines
      - name: Apply transformation
        run: python3 tools/apply_patch31.py
      - name: Remove temporary transformer
        run: |
          rm tools/apply_patch31.py
          rm .github/workflows/apply-patch31.yml
      - name: Commit Patch 31
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Patch 31: improve typing and add emoji panel"
          git push

# Retry trigger after workflow creation
