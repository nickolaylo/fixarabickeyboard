name: Apply Patch 29 Stable More Page

on:
  push:
    branches:
      - agent/patch-29-stable-more-page-compact-compose

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Patch 29 branch
        uses: actions/checkout@v4
        with:
          ref: agent/patch-29-stable-more-page-compact-compose
          fetch-depth: 0

      - name: Apply Patch 29
        run: python3 tools/apply_patch29_stable_more_page.py

      - name: Remove temporary automation files
        run: |
          rm tools/apply_patch29_stable_more_page.py
          rm .github/workflows/apply-patch29-stable-more-page.yml

      - name: Commit Patch 29
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Patch 29: stabilize more page and compact compose"
          git push
