name: Temporary Apply Patch 34

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/patch-34-keyboard-personalization-and-compose-viewport'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patch 34 branch
        uses: actions/checkout@v4
        with:
          ref: agent/patch-34-keyboard-personalization-and-compose-viewport
          fetch-depth: 0

      - name: Assemble and apply Patch 34
        run: |
          cat tools/patch34_parts/part_* > /tmp/apply_patch34.py
          python /tmp/apply_patch34.py

      - name: Remove temporary transformer parts
        run: rm -rf tools/patch34_parts

      - name: Commit Patch 34
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement keyboard personalization and compose viewport"
          git push origin HEAD:agent/patch-34-keyboard-personalization-and-compose-viewport
